<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聴診トレーナー — 自由練習・OSCE評価</title>
<style>
:root {
  --bg: #0e1512; --panel: #16201b; --paper: #f4f1e8; --ink: #17231c;
  --accent: #5a8f6b; --accent2: #c98a3f; --sub: #8ba394; --border: #24332b;
  --good: #5a8f6b; --bad: #c1584a; --warn: #c98a3f;
  --sans: "Hiragino Sans","Noto Sans JP","Malgun Gothic","Microsoft YaHei","Noto Sans KR","Noto Sans SC",-apple-system,sans-serif;
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: #e8ece9; font-size: 14px; line-height: 1.6; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg:#eef2ee; --panel:#ffffff; --border:#dde3dc; }
  body { color: #17231c; }
}
body.embed { background: transparent; }

header { padding: 18px 26px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
.htop { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
h1 { font-size: 18px; font-weight: 700; }
h1 .sub { font-size: 12px; color: var(--sub); font-weight: 400; margin-left: 10px; }
.hright { display: flex; align-items: center; gap: 10px; }
.modes { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
.modes button { border: none; background: none; color: var(--sub); font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; padding: 7px 16px; border-radius: 6px; cursor: pointer; }
.modes button.active { background: var(--accent); color: #0e1512; }
.langsel { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
.langsel button { border: none; background: none; color: var(--sub); font-family: var(--sans);
  font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.langsel button.active { background: var(--accent2); color: #17130a; }

.layout { display: grid; grid-template-columns: 380px 1fr; gap: 0; min-height: calc(100vh - 64px); }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
body.embed .layout { grid-template-columns: 1fr; min-height: auto; }

.diagram-pane { padding: 22px; border-right: 1px solid var(--border); background: var(--panel);
  display: flex; flex-direction: column; align-items: center; }
body.embed .diagram-pane { border-right: none; padding: 14px; }
.now-playing { min-height: 34px; font-size: 12.5px; color: var(--accent); font-weight: 600;
  text-align: center; margin-bottom: 6px; }
.now-playing .loc { color: var(--sub); font-weight: 400; }
.legend { font-size: 10.5px; color: var(--sub); text-align: center; margin-top: 8px; line-height: 1.6; }
.legend .r { color: #9db8a8; } .legend .l { color: #c9a875; }

svg#body { touch-action: none; }
.landmark { cursor: pointer; }
.landmark circle.dot { fill: #3a5045; stroke: #6b8577; stroke-width: 1; transition: fill .15s, r .15s; }
.landmark:hover circle.dot, .landmark.active circle.dot { fill: var(--accent); stroke: #cfe6d8; }
.landmark.checked circle.dot { stroke: var(--accent2); stroke-width: 2; }
.landmark text.lbl { font-size: 8.5px; fill: var(--sub); pointer-events: none; }

.main-pane { padding: 22px 26px; overflow-y: auto; }
body.embed .main-pane { padding: 10px 18px 18px; }

/* --- 自由練習モード --- */
.practice-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
body.embed .practice-controls { display: none; }
.pc-group label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 4px; }
.pc-group select { width: 100%; background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; color: inherit; font-family: var(--sans); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--sub); background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px; line-height: 1.8; }
body.embed .hint { display: none; }
.hint b { color: var(--accent); }
.finding-desc { margin-top: 14px; padding: 14px 16px; background: var(--paper); color: var(--ink);
  border-radius: 6px; font-size: 12.5px; line-height: 1.8; display: none; }
.finding-desc.show { display: block; }
.finding-desc h3 { font-size: 13px; margin-bottom: 6px; }
.link-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
body.embed .link-row { display: none; }
.link-btn { font-family: var(--sans); font-size: 11.5px; font-weight: 600; border: 1px solid var(--border);
  background: var(--panel); color: var(--accent); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.link-btn:hover { border-color: var(--accent); }
.link-status { font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .2s; }
.link-status.show { opacity: 1; }

/* --- OSCEモード --- */
.osce-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.progress-bar { flex: 1; height: 5px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; }
.score-chip { font-family: var(--mono); font-size: 12px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; white-space: nowrap; }
.vignette { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 16px 18px;
  margin-bottom: 14px; font-size: 13px; line-height: 1.8; }
.vignette .id { font-size: 11px; color: #6b6455; margin-bottom: 4px; }
.checklist-box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 12px; }
.checklist-box .t { color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.chk-items { display: flex; flex-wrap: wrap; gap: 5px; }
.chk-item { font-size: 10.5px; padding: 3px 8px; border-radius: 10px; background: var(--bg);
  border: 1px solid var(--border); color: var(--sub); }
.chk-item.done { color: var(--accent); border-color: var(--accent); }
.answer-box label { display: block; font-size: 12.5px; color: var(--sub); margin-bottom: 6px; }
textarea { width: 100%; min-height: 100px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 14px; color: inherit; font-family: var(--sans); font-size: 13.5px;
  line-height: 1.7; resize: vertical; }
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btnrow { display: flex; gap: 10px; margin-top: 12px; }
button.act { font-family: var(--sans); font-size: 13px; font-weight: 600; border: none;
  border-radius: 6px; padding: 10px 20px; cursor: pointer; }
.act.primary { background: var(--accent); color: #0e1512; }
.act.primary:disabled { opacity: .35; cursor: default; }
.act.secondary { background: var(--panel); color: inherit; border: 1px solid var(--border); }

.result { margin-top: 16px; }
.result-score { font-family: var(--mono); font-size: 24px; font-weight: 700; margin-bottom: 10px; }
.result-score .max { font-size: 14px; color: var(--sub); font-weight: 400; }
.rubric-row { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.mark { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.mark.hit { background: var(--good); color: #0e1512; }
.mark.miss { background: var(--panel); border: 1.5px solid var(--border); color: var(--sub); }
.rubric-label { font-size: 12px; font-weight: 600; }
.explain { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 13px 15px; margin-top: 12px; font-size: 12.5px; line-height: 1.8; }
.explain .t { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 5px; }

.footer-note { font-size: 10.5px; color: var(--sub); margin-top: 24px; line-height: 1.7; }
body.embed .footer-note { display: none; }
</style>
</head>
<body>

<header>
  <div class="htop">
    <h1 id="appTitle">聴診トレーナー<span class="sub" id="appSubtitle">Auscultation Trainer</span></h1>
    <div class="hright">
      <div class="langsel">
        <button data-lang="ja" class="active">日本語</button>
        <button data-lang="en">EN</button>
        <button data-lang="ko">한국어</button>
        <button data-lang="zh">中文</button>
      </div>
      <div class="modes" id="modeToggle">
        <button id="modeBtnPractice" class="active"></button>
        <button id="modeBtnOsce"></button>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <div class="diagram-pane">
    <div class="now-playing" id="nowPlaying"></div>
    <svg id="body" viewBox="0 -32 220 372" width="300" height="420"></svg>
    <div class="legend" id="legendText"></div>
  </div>

  <div class="main-pane">

    <!-- 自由練習モード -->
    <div id="panePractice">
      <div class="practice-controls">
        <div class="pc-group">
          <label id="lblOrgan"></label>
          <select id="selOrgan"></select>
        </div>
        <div class="pc-group">
          <label id="lblFinding"></label>
          <select id="selFinding"></select>
        </div>
      </div>
      <div class="hint" id="practiceHint"></div>
      <div class="finding-desc" id="findingDesc"></div>
      <div class="link-row">
        <button class="link-btn" id="getLinkBtn"></button>
        <span class="link-status" id="linkStatus"></span>
      </div>
    </div>

    <!-- OSCEモード -->
    <div id="paneOsce" style="display:none">
      <div class="osce-top">
        <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
        <div style="font-size:11.5px;color:var(--sub);font-family:var(--mono)" id="ptxt">1 / 7</div>
        <div class="score-chip" id="schip">0 pt</div>
      </div>
      <div class="vignette" id="vignette"></div>
      <div class="checklist-box">
        <div class="t" id="checklistTitle"></div>
        <div class="chk-items" id="chkItems"></div>
      </div>
      <div class="answer-box">
        <label id="answerLabel"></label>
        <textarea id="osceAnswer"></textarea>
      </div>
      <div class="btnrow">
        <button class="act primary" id="osceSubmit"></button>
        <button class="act secondary" id="osceNext" style="display:none"></button>
      </div>
      <div id="osceResult"></div>
    </div>

    <div class="footer-note" id="footerNote"></div>
  </div>
</div>

    for (let i = 0; i < n; i++) {

      dampedSine(ctx, dest, {start: tt, freq: 220, peak: 0.4, attack: 0.002, tau: 0.012, dur: 0.045});
    }

/* ============================================================================
   自由練習モードのUI配線
============================================================================ */
const selOrgan = document.getElementById("selOrgan");
const selFinding = document.getElementById("selFinding");
const findingDesc = document.getElementById("findingDesc");

function populateOrganSelect() {
  selOrgan.innerHTML = "";
  for (const key in FINDING_LIBRARY) {
    const opt = document.createElement("option");
    opt.value = key; opt.textContent = tf(FINDING_LIBRARY[key].label);
    selOrgan.appendChild(opt);
  }
}
function populateFindings() {
  const organ = selOrgan.value;
  selFinding.innerHTML = "";
  const findings = FINDING_LIBRARY[organ].findings;
  for (const fkey in findings) {
    const opt = document.createElement("option");
    opt.value = fkey; opt.textContent = tf(findings[fkey].label);
    selFinding.appendChild(opt);
  }
  updateDesc();
  highlightRelevantPoints();
}
function updateDesc() {
  const organ = selOrgan.value, fkey = selFinding.value;
  const f = FINDING_LIBRARY[organ] && FINDING_LIBRARY[organ].findings[fkey];
  if (!f) return;
  findingDesc.innerHTML = `<h3>${tf(f.label)}</h3>${tf(f.desc)}`;
  findingDesc.classList.add("show");
}
function highlightRelevantPoints() {
  const organ = selOrgan.value;
  const pts = FINDING_LIBRARY[organ].points;
  document.querySelectorAll(".landmark").forEach(g => {
    g.style.opacity = pts.includes(g.dataset.key) ? "1" : "0.28";
  });
}
selOrgan.addEventListener("change", populateFindings);
selFinding.addEventListener("change", updateDesc);

/* --- リンク取得（機能②：個別所見の共有／埋め込みリンク） --- */
document.getElementById("getLinkBtn").addEventListener("click", () => {
  const url = new URL(location.href.split("?")[0]);
  url.searchParams.set("embed", "1");
  url.searchParams.set("lang", lang);
  url.searchParams.set("organ", selOrgan.value);
  url.searchParams.set("finding", selFinding.value);
  const link = url.toString();
  const status = document.getElementById("linkStatus");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => {
      status.textContent = t("linkCopied") + "： " + link;
      status.classList.add("show");
      setTimeout(() => status.classList.remove("show"), 4000);
    }).catch(() => { prompt("URL:", link); });
  } else {
    prompt("URL:", link);
  }
});

/* --- ホバーで再生（両モード共通） --- */
let mode = "practice";
let currentCase = null;
let checkedPoints = new Set();

function attachLandmarkHandlers() {
  document.querySelectorAll(".landmark").forEach(g => {
    g.addEventListener("mouseenter", () => {
      const key = g.dataset.key;
      let spec = null;
      const label = tf(LANDMARKS[key].label);
      if (mode === "practice") {
        const organ = selOrgan.value;
        if (!FINDING_LIBRARY[organ].points.includes(key)) return;
        spec = FINDING_LIBRARY[organ].findings[selFinding.value].spec;
      } else if (mode === "osce" && currentCase) {
        const f = currentCase.findings[key];
        if (!f) return;
        spec = f.spec;
        checkedPoints.add(key);
        g.classList.add("checked");
        updateChecklist();
      }
      if (!spec) return;
      g.classList.add("active");
      document.getElementById("nowPlaying").innerHTML =
        `<span class="loc">${t("listening")}</span>${label}`;
      startLoop(spec);
    });
    g.addEventListener("mouseleave", () => {
      g.classList.remove("active");
      stopLoop();
      document.getElementById("nowPlaying").textContent = t("hoverHint");
    });
  });
}

/* ============================================================================
   OSCEモード ロジック
============================================================================ */
let osceOrder = [];
let osceIdx = 0;
let osceScore = 0, osceMax = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startOsce() {
  osceOrder = shuffle(OSCE_CASES);
  osceIdx = 0; osceScore = 0; osceMax = 0;
  loadOsceCase();
}
function loadOsceCase() {
  currentCase = osceOrder[osceIdx];
  checkedPoints = new Set();
  document.querySelectorAll(".landmark").forEach(g => g.classList.remove("checked"));
  document.getElementById("vignette").innerHTML =
    `<div class="id">${currentCase.id}</div>${tf(currentCase.vignette)}`;
  document.getElementById("osceAnswer").value = "";
  document.getElementById("osceAnswer").readOnly = false;
  document.getElementById("osceResult").innerHTML = "";
  document.getElementById("osceSubmit").style.display = "inline-block";
  document.getElementById("osceNext").style.display = "none";
  updateChecklist();
  updateOsceHeader();
}
function updateChecklist() {
  const pts = Object.keys(currentCase.findings);
  const box = document.getElementById("chkItems");
  box.innerHTML = "";
  pts.forEach(k => {
    const span = document.createElement("span");
    span.className = "chk-item" + (checkedPoints.has(k) ? " done" : "");
    span.textContent = tf(LANDMARKS[k].label);
    box.appendChild(span);
  });
}
function updateOsceHeader() {
  document.getElementById("pfill").style.width = (osceIdx / OSCE_CASES.length * 100) + "%";
  document.getElementById("ptxt").textContent = `${osceIdx + 1} / ${OSCE_CASES.length}`;
  document.getElementById("schip").textContent = `${osceScore} / ${osceMax} pt`;
}
function normalize(s) { return (s || "").replace(/\s+/g, ""); }
function kwMatch(kw, norm) {
  if (Array.isArray(kw)) return kw.every(p => norm.includes(normalize(p)));
  return norm.includes(normalize(kw));
}
function gradeOsce(text, rubric) {
  const norm = normalize(text);
  return rubric.map(r => {
    const kws = r.keywords[lang] || r.keywords.ja;
    return {...r, hit: kws.some(kw => kwMatch(kw, norm))};
  });
}
document.getElementById("osceSubmit").addEventListener("click", () => {
  const text = document.getElementById("osceAnswer").value;
  const results = gradeOsce(text, currentCase.rubric);
  const score = results.filter(r => r.hit).reduce((s, r) => s + r.points, 0);
  const max = currentCase.rubric.reduce((s, r) => s + r.points, 0);
  osceScore += score; osceMax += max;

  const rows = results.map(r => `
    <div class="rubric-row">
      <div class="mark ${r.hit ? "hit" : "miss"}">${r.hit ? "✓" : "−"}</div>
      <div><div class="rubric-label">${tf(r.label)}（${r.points}pt）</div></div>
    </div>`).join("");

  const pts = Object.keys(currentCase.findings);
  const checkedCount = pts.filter(p => checkedPoints.has(p)).length;

  document.getElementById("osceResult").innerHTML = `
    <div class="result">
      <div class="result-score">${score} <span class="max">/ ${max} pt</span></div>
      ${rows}
      <div class="explain">
        <div class="t">${t("diagnosisTitle")}</div>
        ${tf(currentCase.diagnosis)}<br><br>
        <div class="t">${t("checklistResultTitle")}</div>
        ${t("checklistResultBody", checkedCount, pts.length)}
      </div>
    </div>`;
  document.getElementById("osceAnswer").readOnly = true;
  document.getElementById("osceSubmit").style.display = "none";
  document.getElementById("osceNext").style.display = "inline-block";
  updateOsceHeader();
});
document.getElementById("osceNext").addEventListener("click", () => {
  osceIdx++;
  if (osceIdx >= OSCE_CASES.length) {
    document.getElementById("vignette").innerHTML = "";
    document.getElementById("osceResult").innerHTML = `
      <div class="result" style="text-align:center;padding:30px 0">
        <div class="result-score" style="font-size:32px">${osceScore} <span class="max">/ ${osceMax} pt</span></div>
        <div style="color:var(--sub);margin-top:6px">${t("finishedLabel", OSCE_CASES.length)}</div>
        <div class="btnrow" style="justify-content:center;margin-top:18px">
          <button class="act secondary" id="restartBtn">${t("restartBtn")}</button>
        </div>
      </div>`;
    document.getElementById("restartBtn").addEventListener("click", startOsce);
    document.getElementById("osceNext").style.display = "none";
    updateOsceHeader();
  } else {
    loadOsceCase();
  }
});

/* --- モード切替 --- */
document.getElementById("modeBtnPractice").addEventListener("click", () => setMode("practice"));
document.getElementById("modeBtnOsce").addEventListener("click", () => setMode("osce"));
function setMode(m) {
  mode = m;
  document.getElementById("modeBtnPractice").classList.toggle("active", m === "practice");
  document.getElementById("modeBtnOsce").classList.toggle("active", m === "osce");
  document.getElementById("panePractice").style.display = m === "practice" ? "block" : "none";
  document.getElementById("paneOsce").style.display = m === "osce" ? "block" : "none";
  if (m === "osce") {
    document.querySelectorAll(".landmark").forEach(g => g.style.opacity = "1");
    if (osceOrder.length === 0) startOsce();
  } else {
    highlightRelevantPoints();
  }
}

============================================================================ */
(function initFromURL() {
  const params = new URLSearchParams(location.search);
  const pLang = params.get("lang");
  if (pLang && UI[pLang]) lang = pLang;
  document.querySelectorAll(".langsel button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));

  const isEmbed = params.get("embed") === "1";
  if (isEmbed) {
    document.body.classList.add("embed");
    document.getElementById("modeToggle").style.display = "none";
  }

  applyLanguage();

  const pOrgan = params.get("organ");
  const pFinding = params.get("finding");
  if (pOrgan && FINDING_LIBRARY[pOrgan]) {
    selOrgan.value = pOrgan;
    populateFindings();
    if (pFinding && FINDING_LIBRARY[pOrgan].findings[pFinding]) {
      selFinding.value = pFinding;
      updateDesc();
    }
  }
})();
